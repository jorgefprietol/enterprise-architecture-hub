name: CI and container delivery
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dotnet:
    name: C# catalog tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test csharp/Architecture.Tests/Architecture.Tests.csproj -c Release --logger 'trx;LogFileName=catalog.trx'
      - run: dotnet list csharp/Architecture.Api/Architecture.Api.csproj package --vulnerable --include-transitive
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: catalog-test-results
          path: csharp/Architecture.Tests/TestResults
  java:
    name: Java decision engine tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -f java/pom.xml verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: decision-engine-test-results
          path: java/target/surefire-reports
  web:
    name: React build and tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
  integration:
    name: Containers and end-to-end tests
    needs: [dotnet, java, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Configure isolated environment
        run: |
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          echo "EDITOR_TOKEN=$key" >> "$GITHUB_ENV"
          printf 'EDITOR_TOKEN=%s\nWEB_PORT=18095\n' "$key" > .env
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: python3 scripts/smoke.py
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: web
      - name: Verify storage survives restart
        run: |
          python3 scripts/persistence.py before
          docker compose restart catalog
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:18095/health && break || sleep 2; done
          python3 scripts/persistence.py after
          python3 scripts/smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-test-results
          path: |
            web/playwright-report
            web/test-results
      - name: Container diagnostics
        if: failure()
        run: |
          docker compose logs --tail=150
          docker inspect --format '{{json .State.Health}}' "$(docker compose ps -q web)" || true
      - name: Cleanup isolated environment
        if: always()
        run: docker compose down -v
  images:
    name: Publish ${{ matrix.service }} image
    needs: integration
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - service: catalog
            context: csharp
          - service: decisions
            context: java
          - service: web
            context: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
