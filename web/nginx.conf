server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'" always;
  location /api/ { proxy_pass http://catalog:8080; proxy_set_header Host $host; proxy_set_header X-Request-ID $request_id; proxy_read_timeout 15s; }
  location = /openapi/v1.json { proxy_pass http://catalog:8080; }
  location = /health { proxy_pass http://catalog:8080; }
  location / { try_files $uri $uri/ /index.html; }
}
